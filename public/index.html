<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillPath AI Counsellor</title>
  <meta name="description" content="AI career counsellor for vocational education and skill-based careers in India.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Tricolour accent strip -->
  <div class="tricolour-strip" aria-hidden="true">
    <div class="strip-orange"></div>
    <div class="strip-white"></div>
    <div class="strip-green"></div>
  </div>

  <div class="chat-container">

    <!-- Header: branding + language toggle + new chat -->
    <header class="chat-header">
      <div class="header-branding">
        <h1 id="header-title">SkillPath AI Counsellor</h1>
        <p id="header-subtitle">Vocational &amp; Skill Career Guidance</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-lang" id="btn-lang-toggle" aria-label="Switch language">
          🌐 <span id="lang-toggle-text">मराठी</span>
        </button>
        <button type="button" class="btn-clear" id="btn-new-chat" title="New Chat" aria-label="Start new conversation">
          🔄
        </button>
      </div>
    </header>

    <!-- Messages -->
    <main class="chat-messages" id="messages-container" role="log" aria-live="polite"></main>

    <!-- Typing indicator -->
    <div class="typing-indicator hidden" id="typing-indicator" aria-label="Thinking">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- Input area -->
    <footer class="chat-footer">
      <form class="chat-form" id="chat-form" autocomplete="off">
        <input
          type="text"
          id="user-input"
          class="chat-input"
          placeholder="Ask a question..."
          maxlength="1000"
          aria-label="Your question"
          required
        />
        <button type="submit" class="btn-send" id="btn-send" aria-label="Send">
          <span id="send-btn-text">Send</span> <span aria-hidden="true">➤</span>
        </button>
      </form>
      <p class="disclaimer" id="disclaimer-text">
        AI answers are general guidance. For verified figures see the portal's data screens.
      </p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
